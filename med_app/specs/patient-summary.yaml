# AppSpec for manifests/patient-summary.yaml.
apiVersion: medapp.eu/v1
kind: AppSpec

app:
  app_id: app_patient_summary
  version: 0.1.0
  name: Patient summary
  description: Problem list, medication and recent vitals for one patient, with the full FHIR record on a separate tab.

archetype: APP-01
knobs:
  identity: header
  arrangement: tabs
  sections:
    - { kind: problems, status: active }
    - { kind: medication, status: active }
    - kind: vitals
      codes:
        - { system: loinc, code: "85354-9", display: Blood pressure panel }
        - { system: loinc, code: "8867-4", display: Heart rate }
        - { system: loinc, code: "29463-7", display: Body weight }
        - { system: loinc, code: "72166-2", display: Tobacco smoking status }
        - { system: loinc, code: "4548-4", display: Hemoglobin A1c }
        - { system: loinc, code: "33914-3", display: eGFR }
    - { kind: record }

roles:
  - id: clinician
    display_name: Treating clinician
    phi_fields_visible: [name, dob, gender, mrn, address, phone, email]
    capabilities: [view, export_pdf]
default_role: clinician

governance:
  clinical_context: general_chart_review
  intended_users: [general_practitioner, internal_medicine]
  intended_purpose: Display of the patient's recorded problems, medication and vitals. Not for diagnosis.
