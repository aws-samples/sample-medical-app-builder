# Showcase — the worklist (APP-13): the ward's open tasks across patients — who, what, by when, how urgent, who has
# taken it — overdue first, with a Mine / Everyone switch. Rows are started, completed or cancelled here (status changes
# the record keeps, attributed to whoever did them) and open the patient in the ward documentation app, whose task form
# is where most of these tasks come from. Nothing is scheduled, reminded or notified: the list shows what is open.
apiVersion: medapp.eu/v1
kind: AppSpec

app:
  app_id: app_ward_worklist
  version: 1.0.0
  name: Ward worklist
  description: The open tasks of the ward across its patients, overdue first; take one on, complete it, open the patient.

archetype: APP-13
knobs:
  codes:
    - { code: falls_screen, display: Falls risk screen }
    - { code: discharge_letter, display: Discharge letter }
    - { code: follow_up_call, display: Follow-up call }
    - { code: physio_referral, display: Physiotherapy referral }
    - { code: wound_check, display: Wound check }
  title: Open tasks on the ward
  cancel: true
  open_in: app_ward_documentation

roles:
  - id: ward_team
    display_name: Ward team
    phi_fields_visible: [name, dob, mrn]
    capabilities: [view, update_status]
default_role: ward_team

governance:
  clinical_context: ward_round
  intended_users: [nurse, physician]
  intended_purpose: The ward's open tasks across its patients, so nothing due is missed; starting and completing a task is recorded with who did it and when. Nothing is scheduled, reminded or interpreted.
