# AppSpec — composed page (APP-12) that ADDS to the record: the ward physician puts a diagnosis on the problem
# list, records an allergy and documents a procedure — each from a fixed list of codes the author chose and the
# reviewer signed, with the few fields that belong to the entry; the platform stamps who, when and through which
# app. The lists beside the forms refresh after a save, so the new entry shows where the record shows it.
apiVersion: medapp.eu/v1
kind: AppSpec

app:
  app_id: app_ward_documentation
  version: 0.1.0
  name: Ward documentation
  description: Add diagnoses to the problem list, record allergies and document procedures — on the record, with provenance.

archetype: APP-12
knobs:
  identity: compact_banner
  arrangement: stack
  sections:
    - kind: problems
      span: 6
      title: Problem list
    - kind: record_problem
      id: add_problem
      span: 6
      title: Add a diagnosis
      codes:
        - { system: icd10gm, code: I10.90, display: "Essential hypertension, unspecified" }
        - { system: icd10gm, code: E11.90, display: "Type 2 diabetes mellitus, without complications" }
        - { system: icd10gm, code: E87.6, display: Hypokalaemia }
        - { system: icd10gm, code: D63.0, display: Anaemia in neoplastic disease }
      verification: [confirmed, provisional]
      severity: true
      action_label: Add to problem list
    - kind: allergies
      span: 6
    - kind: record_allergy
      id: add_allergy
      span: 6
      title: Record an allergy or intolerance
      codes:
        - { system: atc, code: C09AA05, display: Ramipril }
        - { system: atc, code: C08CA01, display: Amlodipine }
        - { system: atc, code: A10BA02, display: Metformin }
        - { system: atc, code: N02CC01, display: Sumatriptan }
      categories: [medication]
    - kind: procedures
      span: 6
    - kind: record_procedure
      id: add_procedure
      span: 6
      title: Document a procedure
      codes:
        - { system: ops, code: 1-632.0, display: Gastroscopy }
        - { system: ops, code: 8-831.0, display: Central venous catheter }
        - { system: ops, code: 8-800.c0, display: Red cell transfusion }
      statuses: [completed, not-done]
      body_site: true
      max_backdate_days: 14

roles:
  - id: ward_physician
    display_name: Ward physician
    phi_fields_visible: [name, dob, mrn]
    capabilities: [view, record_entry]
default_role: ward_physician

governance:
  clinical_context: ward_round
  intended_users: [physician]
  intended_purpose: Documentation by the ward physician on the patient in context — a diagnosis for the problem list, an allergy, a procedure performed — each from a fixed list of codes, validated, attributed and versioned. Nothing is computed or interpreted.
  mdr_classification: none
