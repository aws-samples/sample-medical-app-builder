# Showcase — the cohort archetype (APP-09) narrowed by imaging: the doctor's "all patients with a certain ICD code who
# have had a scan". Membership is the diagnosis — chronic kidney disease, coded either way the connected record codes
# it — kept to the members with renal imaging on record (CT or ultrasound), each with the latest eGFR; every row links
# to the imaging review app, which opens the studies on that patient in its own scope. The register names studies — it
# never retrieves pixels. The hypertension register is the plain register; this one shows the imaging question.
apiVersion: medapp.eu/v1
kind: AppSpec

app:
  app_id: app_ckd_imaging_register
  version: 1.0.0
  name: CKD register with renal imaging
  description: Patients with chronic kidney disease who have had a CT or an ultrasound, with their latest eGFR and a link to the imaging review.

archetype: APP-09
knobs:
  condition:
    codes:
      - { system: snomed, code: "709044004", display: Chronic kidney disease }
      - { system: snomed, code: "433144002", display: Chronic kidney disease stage 3 }
      - { system: icd10gm, code: "N18.3", display: "Chronische Nierenkrankheit, Stadium 3" }
      - { system: icd10gm, code: "N18.4", display: "Chronische Nierenkrankheit, Stadium 4" }
      - { system: icd10gm, code: "N18.5", display: "Chronische Nierenkrankheit, Stadium 5" }
      - { system: icd10gm, code: "N18.9", display: "Chronische Nierenkrankheit, nicht näher bezeichnet" }
    clinical_status: active
    label: chronic kidney disease
  imaging:
    modalities: [CT, US]
    label: renal imaging (CT or ultrasound)
    card_label: With renal imaging
    open_in: app_imaging_3d
  value:
    codes: [{ system: loinc, code: "33914-3", display: eGFR }]
    name: eGFR
    unit: mL/min/1.73m²
    label: Latest eGFR
  cards:
    threshold_hint: Most recent eGFR per patient
  table_title: Patients with CKD and renal imaging

roles:
  - id: nephrology_clinic
    display_name: Nephrology clinic
    phi_fields_visible: [name, dob, mrn]
    capabilities: [view, export_csv]
default_role: nephrology_clinic

governance:
  clinical_context: population_health
  intended_users: [nephrologist, radiologist]
  intended_purpose: Listing of patients with a coded chronic kidney disease diagnosis and at least one CT or ultrasound study on record, with their latest recorded eGFR. Studies are named, not displayed; no staging, no risk scoring, no treatment recommendation.
  mdr_classification: none
