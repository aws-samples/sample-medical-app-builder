# AppSpec — cohort KPI tiles (APP-10): the hypertension register reduced to its headline numbers.
apiVersion: medapp.eu/v1
kind: AppSpec

app:
  app_id: app_htn_kpi
  version: 0.1.0
  name: Hypertension at a glance
  description: How many patients have active hypertension and how many are above 140 systolic.

archetype: APP-10
knobs:
  condition:
    codes:
      - { system: snomed, code: "38341003", display: Hypertensive disorder }
    clinical_status: active
    label: active hypertension
  value:
    codes:
      - { system: loinc, code: "85354-9", display: Blood pressure panel }
    component_code: "8480-6"
    name: systolic
    unit: mmHg
    threshold: 140

roles:
  - id: cohort_analyst
    display_name: Cohort analyst
    phi_fields_visible: [name, mrn]
default_role: cohort_analyst

governance:
  clinical_context: hypertension_population_overview
  intended_users: [department_lead, quality_manager]
  intended_purpose: Headline counts for a wall display. No per-patient rows; no treatment recommendations.
