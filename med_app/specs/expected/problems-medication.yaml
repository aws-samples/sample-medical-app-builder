# Golden output of the compiler for specs/problems-medication.yaml (lifecycle omitted: it is registry-managed).
# Regenerate deliberately when the compiler changes: npm run appspec -- compile specs/problems-medication.yaml
apiVersion: medapp.eu/v1
kind: AppManifest
metadata:
  app_id: app_problems_medication
  version: 0.1.0
  name: Problems and medication
  description: Active problems next to current medication for one patient.
  intent_class: viewer
  hospital_id: hsp-musterstadt
  created_at: 2026-09-15T09:00:00Z
auth:
  roles:
    - id: clinician
      display_name: Treating clinician
      cognito_group: app-app_problems_medication-clinician
      data_scope_ref: scope_clinician
      ui_capabilities:
        - view
  default_role: clinician
data_scopes:
  scope_clinician:
    fhir:
      - resource: Patient
        operations:
          - read
      - resource: Condition
        operations:
          - search
        filter: subject={context.patient_id}
      - resource: MedicationRequest
        operations:
          - search
        filter: subject={context.patient_id}
    patient_scope: individual
    phi_fields_visible:
      - name
      - dob
      - gender
      - mrn
primitives:
  - id: p_patient
    kind: data.fhir.patient.read
    catalog_version: 1.0.0
    config:
      patient: $context.patient_id
    output_binding: patient
  - id: p_conditions
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: Condition
      params:
        patient: $context.patient_id
        clinical-status: active
    output_binding: conditions
  - id: p_medications
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: MedicationRequest
      params:
        patient: $context.patient_id
    output_binding: medications
layout:
  design_system_version: 1.0.0
  root:
    component: PageShell
    props:
      title: $metadata.name
      subtitle: $metadata.description
    children:
      - component: PatientBanner
        props:
          patient: $bindings.patient
          visible_fields: $auth.effective.phi_fields_visible
      - component: TwoColumn
        props:
          ratio:
            - 6
            - 6
        children:
          - component: ProblemList
            props:
              conditions: $bindings.conditions
              title: Active problems
          - component: MedicationList
            props:
              medications: $bindings.medications
              title: Medication history
context_inputs:
  - name: patient_id
    type: fhir.reference
    required: true
    source:
      - smart_launch
      - panel_selection
actions: []
audit:
  clinical_context: outpatient_consultation
  intended_users:
    - general_practitioner
    - internist
  intended_purpose: Display of the recorded problem list and medication orders. No interaction checking or recommendations.
  mdr_classification: none
  data_categories:
    - phi
    - medication
lifecycle:
  state: draft
  signoff: null
