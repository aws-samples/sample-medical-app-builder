# Golden output of the compiler for specs/hypertension-kpi.yaml (lifecycle omitted: it is registry-managed).
# Regenerate deliberately when the compiler changes: npm run appspec -- compile specs/hypertension-kpi.yaml
apiVersion: medapp.eu/v1
kind: AppManifest
metadata:
  app_id: app_htn_kpi
  version: 0.1.0
  name: Hypertension at a glance
  description: How many patients have active hypertension and how many are above 140 systolic.
  intent_class: cohort_dashboard
  hospital_id: hsp-musterstadt
  created_at: 2026-09-15T09:00:00Z
auth:
  roles:
    - id: cohort_analyst
      display_name: Cohort analyst
      cognito_group: app-app_htn_kpi-cohort_analyst
      data_scope_ref: scope_cohort_analyst
      ui_capabilities:
        - view
  default_role: cohort_analyst
data_scopes:
  scope_cohort_analyst:
    fhir:
      - resource: Patient
        operations:
          - read
      - resource: Condition
        operations:
          - search
        codes:
          - http://snomed.info/sct|38341003
      - resource: Observation
        operations:
          - search
        codes:
          - http://loinc.org|85354-9
    patient_scope: cohort
    phi_fields_visible:
      - name
      - mrn
primitives:
  - id: p_cohort
    kind: data.cohort.by_condition
    catalog_version: 1.0.0
    config:
      condition_codes:
        - http://snomed.info/sct|38341003
      clinical_status: active
    output_binding: cohort
  - id: p_latest
    kind: data.cohort.latest_observation
    catalog_version: 1.0.0
    config:
      patients: $bindings.cohort.patients
      codes:
        - http://loinc.org|85354-9
      threshold:
        component_code: 8480-6
        value: 140
    output_binding: latest
layout:
  design_system_version: 1.0.0
  root:
    component: PageShell
    props:
      title: $metadata.name
      subtitle: $metadata.description
    children:
      - component: Grid
        props:
          columns: 3
        children:
          - component: StatCard
            props:
              label: Patients with active hypertension
              value: $bindings.cohort.count
              hint: SNOMED CT 38341003 on the problem list
              tone: accent
          - component: StatCard
            props:
              label: Latest systolic ≥ 140 mmHg
              value: $bindings.latest.above_threshold_count
              hint: Most recent value per patient
              tone: alert
          - component: StatCard
            props:
              label: Data scope
              value: cohort
              hint: Name and MRN visible; no contact details
context_inputs: []
actions: []
audit:
  clinical_context: hypertension_population_overview
  intended_users:
    - department_lead
    - quality_manager
  intended_purpose: Headline counts for a wall display. No per-patient rows; no treatment recommendations.
  mdr_classification: none
  data_categories:
    - phi
    - clinical_measurements
lifecycle:
  state: draft
  signoff: null
