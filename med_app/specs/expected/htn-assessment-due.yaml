# Golden output of the compiler for specs/htn-assessment-due.yaml (lifecycle as compiled: a draft; the registry manages it from there).
# Regenerate deliberately when the compiler changes: npm run appspec -- compile specs/htn-assessment-due.yaml --created-at 2026-09-15T09:00:00Z
apiVersion: medapp.eu/v1
kind: AppManifest
metadata:
  app_id: app_htn_assessment_due
  version: 0.1.0
  name: Follow-up assessments due
  description: Hypertension patients due the follow-up assessment — never assessed or more than 90 days since the last one.
  intent_class: cohort_dashboard
  hospital_id: hsp-musterstadt
  created_at: 2026-09-15T09:00:00Z
lifecycle:
  state: draft
  signoff: null
  provenance:
    generated_by_pipeline_version: 0.1.0
auth:
  roles:
    - id: hypertension_nurse
      display_name: Hypertension nurse
      cognito_group: app-app_htn_assessment_due-hypertension_nurse
      data_scope_ref: scope_hypertension_nurse
      ui_capabilities:
        - view
  default_role: hypertension_nurse
data_scopes:
  scope_hypertension_nurse:
    fhir:
      - resource: Patient
        operations:
          - read
      - resource: Condition
        operations:
          - search
        codes:
          - http://snomed.info/sct|38341003
      - resource: QuestionnaireResponse
        operations:
          - search
        filter: questionnaire=https://klinikum-musterstadt.example/fhir/Questionnaire/htn-followup
    patient_scope: cohort
    phi_fields_visible:
      - name
      - dob
      - mrn
primitives:
  - id: p_cohort
    kind: data.cohort.by_condition
    catalog_version: 1.0.0
    config:
      condition_codes:
        - http://snomed.info/sct|38341003
      clinical_status: active
    output_binding: cohort
  - id: p_due
    kind: data.cohort.assessment_due
    catalog_version: 1.0.0
    config:
      questionnaire: https://klinikum-musterstadt.example/fhir/Questionnaire/htn-followup
      every_days: 90
      patients: $bindings.cohort.patients
      upcoming_days: 14
    output_binding: due
layout:
  design_system_version: 1.0.0
  root:
    component: PageShell
    props:
      title: $metadata.name
      subtitle: $metadata.description
    children:
      - component: Grid
        props:
          columns: 4
        children:
          - component: StatCard
            props:
              label: Due a follow-up assessment
              value: $bindings.due.count
              hint: patients with active hypertension · every 90 days
              tone: accent
          - component: StatCard
            props:
              label: Never assessed
              value: $bindings.due.never_count
              hint: SNOMED CT 38341003 on the problem list, no answer on record
              tone: alert
          - component: StatCard
            props:
              label: Overdue
              value: $bindings.due.overdue_count
              hint: Last answer more than 90 days ago
              tone: alert
          - component: StatCard
            props:
              label: Data scope
              value: cohort
              hint: Name, date of birth and MRN visible; no contact details
      - component: AssessmentDueList
        props:
          rows: $bindings.due.rows
          title: Due the follow-up assessment
          label: follow-up assessment
          every_days: 90
          open_in: app_hypertension_follow_up
context_inputs: []
actions: []
audit:
  clinical_context: hypertension_clinic
  intended_users:
    - nurse
  intended_purpose: Which hypertension patients are due the clinic's follow-up assessment, from the record's own answers; the nurse opens the patient's follow-up app from the row. Nothing is scheduled, reminded or interpreted.
  mdr_classification: none
  data_categories:
    - phi
    - clinical_documentation
