# AppSpec — composed page (APP-12) that WRITES: the ward nurse records a blood pressure, marks a problem
# resolved and stops a prescription — each a validated, versioned, attributed change on the hospital's
# record, never a free edit. The recorded value shows up in the trend beside the form.
apiVersion: medapp.eu/v1
kind: AppSpec

app:
  app_id: app_ward_entry
  version: 0.1.0
  name: Ward entry
  description: Record a blood pressure reading, mark problems resolved and stop prescriptions — on the record, with provenance.

archetype: APP-12
knobs:
  identity: compact_banner
  arrangement: stack
  window: now-1y
  sections:
    - kind: record_observation
      id: bp_entry
      span: 4
      title: Record a blood pressure
      code: { system: loinc, code: "85354-9", display: Blood pressure panel }
      components:
        - { code: { system: loinc, code: "8480-6", display: Systolic blood pressure }, label: Systolic, range: { min: 50, max: 300 } }
        - { code: { system: loinc, code: "8462-4", display: Diastolic blood pressure }, label: Diastolic, range: { min: 30, max: 200 } }
      unit: mmHg
      category: vital-signs
      action_label: Record reading
      success_message: The reading is now part of the patient record.
    - kind: trend
      id: bp
      span: 8
      codes:
        - { system: loinc, code: "85354-9", display: Blood pressure panel }
      series:
        - { label: Systolic, component_code: "8480-6" }
        - { label: Diastolic, component_code: "8462-4" }
      unit: mmHg
      height_px: 280
    - kind: problems
      span: 6
      resolve: true
    - kind: medication
      span: 6
      stop: true

roles:
  - id: ward_nurse
    display_name: Ward nurse
    phi_fields_visible: [name, dob, mrn]
    capabilities: [view, record_observation, update_status]
default_role: ward_nurse

governance:
  clinical_context: ward_round
  intended_users: [nurse]
  intended_purpose: Recording of blood pressure readings and status changes of problems and prescriptions by the ward nurse, on the patient in context. Each change is validated against the form's rules, versioned and attributed; nothing is computed or interpreted.
  mdr_classification: none
