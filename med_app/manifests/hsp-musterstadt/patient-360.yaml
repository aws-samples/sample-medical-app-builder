# Seed app of hsp-musterstadt — compiled from specs/patient-360.yaml by scripts/build-showcase.mjs (npm run showcase); do not edit by hand.
# The lifecycle block is an example sign-off: the registry seed publishes the app with it.
apiVersion: medapp.eu/v1
kind: AppManifest
metadata:
  app_id: app_patient_360
  version: 1.0.0
  name: Patient 360
  description: Problems, medication, vitals, allergies, visits, reports, letters,
    procedures, immunizations, laboratory results and the FHIR record of one
    patient, on one page.
  intent_class: viewer
  hospital_id: hsp-musterstadt
  created_at: "2026-10-01T14:00:00Z"
lifecycle:
  state: published
  signoff:
    approver_sub: example-approver-sub
    approved_at: "2026-10-01T15:00:00Z"
    signature: "example: KMS-signed manifest_hash goes here"
    clinical_notes: Display only; nothing computed, scored or interpreted. Approved
      for chart review.
  provenance:
    generated_by_pipeline_version: 0.1.0
auth:
  roles:
    - id: clinician
      display_name: Treating clinician
      cognito_group: app-app_patient_360-clinician
      data_scope_ref: scope_clinician
      ui_capabilities:
        - view
    - id: senior_clinician
      display_name: Senior clinician
      cognito_group: app-app_patient_360-senior_clinician
      data_scope_ref: scope_senior_clinician
      ui_capabilities:
        - view
        - open_viewer
  default_role: clinician
data_scopes:
  scope_clinician:
    fhir:
      - resource: Patient
        operations:
          - read
      - resource: Condition
        operations:
          - search
        filter: subject={context.patient_id}
      - resource: MedicationRequest
        operations:
          - search
        filter: subject={context.patient_id}
      - resource: Observation
        operations:
          - search
        codes:
          - http://loinc.org|85354-9
          - http://loinc.org|8867-4
          - http://loinc.org|29463-7
        filter: subject={context.patient_id}&date=ge{context.window_start}
      - resource: AllergyIntolerance
        operations:
          - search
        filter: subject={context.patient_id}
      - resource: Encounter
        operations:
          - search
        filter: subject={context.patient_id}
      - resource: DiagnosticReport
        operations:
          - search
        filter: subject={context.patient_id}
      - resource: DocumentReference
        operations:
          - search
        filter: subject={context.patient_id}
      - resource: Procedure
        operations:
          - search
        filter: subject={context.patient_id}
      - resource: Immunization
        operations:
          - search
        filter: subject={context.patient_id}
    patient_scope: individual
    phi_fields_visible:
      - name
      - dob
      - gender
      - mrn
  scope_senior_clinician:
    inherits: scope_clinician
    phi_fields_visible:
      - name
      - dob
      - gender
      - mrn
      - address
      - phone
      - email
primitives:
  - id: p_patient
    kind: data.fhir.patient.read
    catalog_version: 1.0.0
    config:
      patient: $context.patient_id
    output_binding: patient
  - id: p_headline_conditions
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: Condition
      params:
        patient: $context.patient_id
        clinical-status: active
    output_binding: headline_conditions
  - id: p_headline_medications
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: MedicationRequest
      params:
        patient: $context.patient_id
        status: active
    output_binding: headline_medications
  - id: p_headline_readings
    kind: data.fhir.observation.by_code
    catalog_version: 1.0.0
    config:
      patient: $context.patient_id
      codes:
        - http://loinc.org|85354-9
      since: $context.window_start
      count: 100
    output_binding: headline_readings
  - id: p_problems
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: Condition
      params:
        patient: $context.patient_id
        clinical-status: active
    output_binding: problems
  - id: p_medication
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: MedicationRequest
      params:
        patient: $context.patient_id
        status: active
    output_binding: medication
  - id: p_bp
    kind: data.fhir.observation.by_code
    catalog_version: 1.0.0
    config:
      patient: $context.patient_id
      codes:
        - http://loinc.org|85354-9
      since: $context.window_start
      count: 500
    output_binding: bp
  - id: p_vitals
    kind: data.fhir.observation.by_code
    catalog_version: 1.0.0
    config:
      patient: $context.patient_id
      codes:
        - http://loinc.org|85354-9
        - http://loinc.org|8867-4
        - http://loinc.org|29463-7
      since: $context.window_start
      count: 8
    output_binding: vitals
  - id: p_allergies
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: AllergyIntolerance
      params:
        patient: $context.patient_id
        clinical-status: active
    output_binding: allergies
  - id: p_encounters
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: Encounter
      params:
        patient: $context.patient_id
    output_binding: encounters
  - id: p_reports
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: DiagnosticReport
      params:
        patient: $context.patient_id
    output_binding: reports
  - id: p_notes
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: DocumentReference
      params:
        patient: $context.patient_id
    output_binding: notes
  - id: p_procedures
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: Procedure
      params:
        patient: $context.patient_id
    output_binding: procedures
  - id: p_immunizations
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: Immunization
      params:
        patient: $context.patient_id
    output_binding: immunizations
  - id: p_labs
    kind: data.fhir.query
    catalog_version: 1.0.0
    config:
      resource: Observation
      params:
        patient: $context.patient_id
        category: laboratory
    output_binding: labs
layout:
  design_system_version: 1.0.0
  root:
    component: PageShell
    props:
      title: $metadata.name
      subtitle: $metadata.description
    children:
      - component: PatientBanner
        props:
          patient: $bindings.patient
          visible_fields: $auth.effective.phi_fields_visible
      - component: Grid
        props:
          columns: 3
        children:
          - component: StatCard
            props:
              label: Active problems
              value: $bindings.headline_conditions.length
              hint: On the problem list now
          - component: StatCard
            props:
              label: Current medication
              value: $bindings.headline_medications.length
              hint: Active prescriptions
          - component: StatCard
            props:
              label: Readings, last two years
              value: $bindings.headline_readings.length
              hint: Vitals and key labs recorded in the window
              tone: accent
      - component: TwoColumn
        props:
          ratio:
            - 6
            - 6
        children:
          - component: ProblemList
            props:
              conditions: $bindings.problems
              title: Active problems
          - component: MedicationList
            props:
              medications: $bindings.medication
              title: Current medication
      - component: TwoColumn
        props:
          ratio:
            - 8
            - 4
        children:
          - component: ObservationTimeline
            props:
              title: Blood pressure, last two years
              observations: $bindings.bp
              unit: mmHg
              height_px: 300
              series:
                - label: Systolic
                  component_code: 8480-6
                - label: Diastolic
                  component_code: 8462-4
              thresholds:
                - value: 140
                  label: 140 mmHg
                - value: 90
                  label: 90 mmHg
          - component: VitalsTable
            props:
              observations: $bindings.vitals
              title: Latest vitals
              max_rows: 8
              compact: true
      - component: TwoColumn
        props:
          ratio:
            - 6
            - 6
        children:
          - component: AllergyList
            props:
              allergies: $bindings.allergies
          - component: EncounterList
            props:
              encounters: $bindings.encounters
              title: Visits
              max_rows: 8
      - component: TwoColumn
        props:
          ratio:
            - 6
            - 6
        children:
          - component: ReportList
            props:
              reports: $bindings.reports
              title: Reports
              max_rows: 6
          - component: DocumentList
            props:
              documents: $bindings.notes
              title: Letters and notes
              max_rows: 6
      - component: TwoColumn
        props:
          ratio:
            - 6
            - 6
        children:
          - component: ResourceList
            props:
              resources: $bindings.procedures
              title: Procedures
              columns:
                - label: Date
                  path: performedDateTime
                - label: Procedure
                  path: code
                - label: Body site
                  path: bodySite[0]
                - label: Outcome
                  path: outcome
                - label: Status
                  path: status
                  status: true
              max_rows: 10
              empty_text: No procedures recorded.
          - component: ResourceList
            props:
              resources: $bindings.immunizations
              title: Immunizations
              columns:
                - label: Date
                  path: occurrenceDateTime
                - label: Vaccine
                  path: vaccineCode
                - label: Lot
                  path: lotNumber
                - label: Status
                  path: status
                  status: true
              max_rows: 10
              empty_text: No immunizations recorded.
      - component: ResourceList
        props:
          resources: $bindings.labs
          title: Laboratory results
          columns:
            - label: Date
              path: effectiveDateTime
            - label: Test
              path: code
            - label: Result
              path: valueQuantity
            - label: Status
              path: status
              status: true
          max_rows: 15
      - component: ResourceDetails
        props:
          resource: $bindings.patient
          title: Patient record (FHIR)
        show_only_if_role_in:
          - senior_clinician
context_inputs:
  - name: patient_id
    type: fhir.reference
    required: true
    source:
      - smart_launch
      - panel_selection
  - name: window_start
    type: iso8601
    required: false
    source:
      - panel_selection
    default: now-2y
actions: []
audit:
  clinical_context: chart_review
  intended_users:
    - internist
    - ward_physician
    - general_practitioner
  intended_purpose: Display of the recorded problems, medication, observations,
    allergies, visits, reports, letters, procedures, immunizations and
    laboratory results of the patient in context, for chart review before and
    during a consultation. Display only; nothing is computed, scored or
    interpreted.
  mdr_classification: none
  data_categories:
    - phi
    - clinical_measurements
    - medication
    - allergies
    - encounters
    - procedures
    - immunizations
    - clinical_documentation
