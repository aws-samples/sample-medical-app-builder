# Seed app of hsp-musterstadt — compiled from specs/ward-open-tasks.yaml by scripts/build-showcase.mjs (npm run showcase); do not edit by hand.
# The lifecycle block is an example sign-off: the registry seed publishes the app with it.
apiVersion: medapp.eu/v1
kind: AppManifest
metadata:
  app_id: app_ward_worklist
  version: 1.0.0
  name: Ward worklist
  description: The open tasks of the ward across its patients, overdue first; take
    one on, complete it, open the patient.
  intent_class: workflow
  hospital_id: hsp-musterstadt
  created_at: "2026-10-01T14:00:00Z"
lifecycle:
  state: published
  signoff:
    approver_sub: example-approver-sub
    approved_at: "2026-10-01T15:00:00Z"
    signature: "example: KMS-signed manifest_hash goes here"
    clinical_notes: The open tasks across the ward's patients, started and completed
      from the row with attribution; nothing scheduled or reminded. Approved for
      the wards.
  provenance:
    generated_by_pipeline_version: 0.1.0
auth:
  roles:
    - id: ward_team
      display_name: Ward team
      cognito_group: app-app_ward_worklist-ward_team
      data_scope_ref: scope_ward_team
      ui_capabilities:
        - view
        - update_status
  default_role: ward_team
data_scopes:
  scope_ward_team:
    fhir:
      - resource: Patient
        operations:
          - read
      - resource: Task
        operations:
          - search
          - update
      - resource: Provenance
        operations:
          - create
    patient_scope: cohort
    phi_fields_visible:
      - name
      - dob
      - mrn
primitives:
  - id: p_worklist
    kind: data.task.worklist
    catalog_version: 1.0.0
    config:
      codes:
        - urn:medapp:task|falls_screen
        - urn:medapp:task|discharge_letter
        - urn:medapp:task|follow_up_call
        - urn:medapp:task|physio_referral
        - urn:medapp:task|wound_check
      statuses:
        - requested
        - in-progress
    output_binding: worklist
  - id: p_task_status
    kind: write.fhir.task.update_status
    catalog_version: 1.0.0
    config:
      allowed:
        - in-progress
        - completed
        - cancelled
      change: $ui.worklist_status
    output_binding: task_updated
layout:
  design_system_version: 1.0.0
  root:
    component: PageShell
    props:
      title: $metadata.name
      subtitle: $metadata.description
    children:
      - component: Grid
        props:
          columns: 3
        children:
          - component: StatCard
            props:
              label: Open tasks
              value: $bindings.worklist.count
              hint: requested or in-progress · Falls risk screen, Discharge letter, Follow-up
                call, Physiotherapy referral, Wound check
              tone: accent
          - component: StatCard
            props:
              label: Overdue
              value: $bindings.worklist.overdue_count
              hint: Due date before today
              tone: alert
          - component: StatCard
            props:
              label: Data scope
              value: cohort
              hint: Name, date of birth and MRN visible; no contact details
      - component: Worklist
        props:
          rows: $bindings.worklist.rows
          title: Open tasks on the ward
          status_action: update_task
          state_key: worklist_status
          cancel: true
          open_in: app_ward_documentation
context_inputs: []
actions:
  - id: update_task
    label: Update task
    primitive: p_task_status
    on_success: reload
    success_message: The task was updated.
audit:
  clinical_context: ward_round
  intended_users:
    - nurse
    - physician
  intended_purpose: The ward's open tasks across its patients, so nothing due is
    missed; starting and completing a task is recorded with who did it and when.
    Nothing is scheduled, reminded or interpreted.
  mdr_classification: none
  data_categories:
    - phi
    - tasks
