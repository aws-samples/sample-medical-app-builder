# Record shape for a kind the platform has not admitted — the example of an administrator-defined kind. A Flag is the
# prospective warning on a chart (falls risk, isolation precautions, an interpreter needed): the platform knows its element
# paths but not its semantics, so the shape declares the stamps itself — the status, the patient, who raised it, since when.
# Only an administrator may define or revise a shape like this; apps then write with it like with any other.
apiVersion: medapp.eu/v1
kind: RecordShape
shape:
  id: patient_alert
  name: Patient alert
  description: A warning shown with the chart — falls risk, isolation precautions, an interpreter needed — as a FHIR Flag, active from the moment it is raised.
  resource: Flag
  stamps:
    - { path: status, value: active }
    - { path: subject, value: $patient }
    - { path: author, value: $author }
    - { path: period.start, value: $today }
  fields:
    - id: alert
      label: Alert
      type: choice
      path: code
      required: true
      system: https://hsp-musterstadt.medapp.eu/CodeSystem/alerts
      options:
        - { code: falls_risk, display: Falls risk }
        - { code: isolation_precautions, display: Isolation precautions }
        - { code: interpreter_needed, display: Interpreter needed }
        - { code: hearing_impaired, display: Hearing impaired }
        - { code: mobility_aid, display: Walks with an aid }
    - id: category
      label: Kind of alert
      type: choice
      path: "category[0]"
      system: http://terminology.hl7.org/CodeSystem/flag-category
      options:
        - { code: safety, display: Safety }
        - { code: clinical, display: Clinical }
        - { code: admin, display: Administrative }
    - { id: until, label: Review by, type: date, path: period.end, future_days: 365 }
