# Archetype: cohort dashboard (no single patient in context).
# Shows: patient_scope cohort, chained primitives ($bindings feeding a later primitive),
# Grid of StatCards reading nested binding paths, a table typed to a primitive's output.
apiVersion: medapp.eu/v1
kind: AppManifest

metadata:
  app_id: app_htn_cohort
  version: 0.1.0
  name: Hypertension cohort
  description: Patients with an active hypertension diagnosis and their most recent blood pressure.
  intent_class: cohort_dashboard
  hospital_id: hsp-musterstadt
  created_at: "2026-09-11T09:30:00Z"

lifecycle:
  state: published
  signoff:
    approver_sub: example-approver-sub
    approved_at: "2026-09-11T10:05:00Z"
    signature: "example: KMS-signed manifest_hash goes here"
    clinical_notes: Listing only; no risk scoring. Approved for the hypertension clinic.

auth:
  roles:
    - id: cohort_analyst
      display_name: Cohort analyst
      cognito_group: app-app_htn_cohort-cohort_analyst
      data_scope_ref: scope_cohort_analyst
      ui_capabilities: [view, export_csv]
  default_role: cohort_analyst

data_scopes:
  scope_cohort_analyst:
    patient_scope: cohort
    phi_fields_visible: [name, dob, mrn]
    fhir:
      - resource: Patient
        operations: [read]
      - resource: Condition
        operations: [search]
        codes: ["http://snomed.info/sct|38341003"]
      - resource: Observation
        operations: [search]
        codes: ["http://loinc.org|85354-9"]

primitives:
  - id: p_cohort
    kind: data.cohort.by_condition
    catalog_version: 1.0.0
    config:
      condition_codes: ["http://snomed.info/sct|38341003"]
      clinical_status: active
    output_binding: cohort

  - id: p_latest
    kind: data.cohort.latest_observation
    catalog_version: 1.0.0
    config:
      patients: $bindings.cohort.patients
      codes: ["http://loinc.org|85354-9"]
      threshold:
        component_code: "8480-6"
        value: 140
    output_binding: latest

layout:
  design_system_version: 1.0.0
  root:
    component: PageShell
    props:
      title: $metadata.name
      subtitle: $metadata.description
    children:
      - component: Grid
        props:
          columns: 3
        children:
          - component: StatCard
            props:
              label: Patients with active hypertension
              value: $bindings.cohort.count
              hint: SNOMED CT 38341003 on the problem list
              tone: accent
          - component: StatCard
            props:
              label: Latest systolic ≥ 140 mmHg
              value: $bindings.latest.above_threshold_count
              hint: Most recent blood pressure panel per patient
              tone: alert
          - component: StatCard
            props:
              label: Data scope
              value: cohort
              hint: Name, date of birth and MRN visible; no contact details
      - component: CohortTable
        props:
          title: Cohort members
          rows: $bindings.latest.rows
          value_label: Latest blood pressure

context_inputs: []

audit:
  clinical_context: population_health
  intended_users: [hypertension_nurse, cardiologist]
  intended_purpose: Listing of patients meeting a coded criterion with their latest recorded values. No risk scoring.
  mdr_classification: none
  data_categories: [phi, clinical_measurements]
