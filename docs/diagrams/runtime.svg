<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1200" viewBox="0 0 1300 1200">
<defs><marker id="arrow-2F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FB2"/></marker><marker id="arrow-5B6770" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker><marker id="arrow-B42318" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker></defs>
<rect width="1300" height="1200" fill="white"/>
<text x="30" y="40" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933">One data call at runtime — the enforcement chain of the dispatcher</text>
<text x="30" y="62" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5B6770">The browser sends the primitive id, the app and version, the role and the launch context. The server decides everything else from the registry and the token; a refusal is audited like a success.</text>
<rect x="50" y="100" width="380" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="240.0" y="142.65" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">Panel in the browser</text>
<text x="240.0" y="155.25" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">the renderer plans the manifest's primitives and sends one request each:</text>
<text x="240.0" y="167.85" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">POST /primitives/{kind} · Authorization: Cognito ID token</text>
<rect x="470" y="100" width="380" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="660.0" y="142.65" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">API Gateway — JWT authorizer</text>
<text x="660.0" y="155.25" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">issuer and audience of the hospital's user pool,</text>
<text x="660.0" y="167.85" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">signature and expiry; the claims reach the Lambda</text>
<rect x="50" y="240" width="800" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="450.0" y="277.95" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">1 · Version</text>
<text x="450.0" y="290.55" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">load app_id@version from the registry — never from the client</text>
<rect x="880" y="256" width="240" height="46" rx="8" ry="8" fill="#FBEDEB" stroke="#B42318" stroke-width="1.2"/>
<text x="1000.0" y="283.25" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1F2933">unknown version → 404</text>
<rect x="50" y="338" width="800" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="450.0" y="375.95" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">2 · Published?</text>
<text x="450.0" y="388.55" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">the version is published, or the caller is platform staff previewing a draft</text>
<rect x="880" y="354" width="240" height="46" rx="8" ry="8" fill="#FBEDEB" stroke="#B42318" stroke-width="1.2"/>
<text x="1000.0" y="381.25" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1F2933">otherwise → 403</text>
<rect x="50" y="436" width="800" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="450.0" y="473.95" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">3 · Role</text>
<text x="450.0" y="486.55" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">the token's groups against the manifest's own role bindings; blanket viewers get the default role</text>
<rect x="880" y="452" width="240" height="46" rx="8" ry="8" fill="#FBEDEB" stroke="#B42318" stroke-width="1.2"/>
<text x="1000.0" y="479.25" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1F2933">no binding → 403</text>
<rect x="50" y="534" width="800" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="450.0" y="571.95" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">4 · Primitive</text>
<text x="450.0" y="584.5500000000001" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">declared by this version, of the stated kind, allowed for this role (only_for_roles)</text>
<rect x="880" y="550" width="240" height="46" rx="8" ry="8" fill="#FBEDEB" stroke="#B42318" stroke-width="1.2"/>
<text x="1000.0" y="577.25" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1F2933">undeclared → 404</text>
<rect x="50" y="632" width="800" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="450.0" y="669.95" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">5 · Scope</text>
<text x="450.0" y="682.5500000000001" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">the role's effective data scope grants the resource type and operation; cohort scope for cross-patient lists</text>
<rect x="880" y="648" width="240" height="46" rx="8" ry="8" fill="#FBEDEB" stroke="#B42318" stroke-width="1.2"/>
<text x="1000.0" y="675.25" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1F2933">not granted → 403</text>
<rect x="50" y="730" width="800" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="450.0" y="767.95" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">6 · Configuration</text>
<text x="450.0" y="780.5500000000001" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">the launch context fits the declared inputs; codes, patient filter, window and write rules are resolved from the manifest — a request that differs is refused, the paths recorded</text>
<rect x="880" y="746" width="240" height="46" rx="8" ry="8" fill="#FBEDEB" stroke="#B42318" stroke-width="1.2"/>
<text x="1000.0" y="773.25" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1F2933">differs → 400</text>
<rect x="50" y="828" width="800" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="450.0" y="865.95" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">7 · Execute</text>
<text x="450.0" y="878.5500000000001" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">FHIR or DICOMweb with the platform's credentials; writes validated against the declared rules, stamped with Provenance</text>
<rect x="880" y="844" width="240" height="46" rx="8" ry="8" fill="#FBEDEB" stroke="#B42318" stroke-width="1.2"/>
<text x="1000.0" y="871.25" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1F2933">payload invalid → 422</text>
<rect x="50" y="946" width="1070" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#5B6770" stroke-width="1.2"/>
<text x="585.0" y="977.35" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2933">8 · Audit record — written whatever happened</text>
<text x="585.0" y="989.95" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">audit_id · app · version · primitive · kind · role and how it was obtained (group, blanket, staff preview) · caller · patient in context</text>
<text x="585.0" y="1002.5500000000001" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">hash of the data scope that applied · outcome ok / refused / error · duration · what was read or written · payload hash for writes · config paths that differed or were dropped</text>
<text x="585.0" y="1015.1500000000001" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.6" font-weight="400" fill="#5B6770">the audit writer may only PutItem: nothing can update or delete a record</text>
<path d="M430,150 L470,150" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<path d="M660,200 L660,240" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<path d="M850,279 L880,279" fill="none" stroke="#B42318" stroke-width="1.3" marker-end="url(#arrow-B42318)" stroke-linejoin="round"/>
<path d="M450,318 L450,338" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<path d="M850,377 L880,377" fill="none" stroke="#B42318" stroke-width="1.3" marker-end="url(#arrow-B42318)" stroke-linejoin="round"/>
<path d="M450,416 L450,436" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<path d="M850,475 L880,475" fill="none" stroke="#B42318" stroke-width="1.3" marker-end="url(#arrow-B42318)" stroke-linejoin="round"/>
<path d="M450,514 L450,534" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<path d="M850,573 L880,573" fill="none" stroke="#B42318" stroke-width="1.3" marker-end="url(#arrow-B42318)" stroke-linejoin="round"/>
<path d="M450,612 L450,632" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<path d="M850,671 L880,671" fill="none" stroke="#B42318" stroke-width="1.3" marker-end="url(#arrow-B42318)" stroke-linejoin="round"/>
<path d="M450,710 L450,730" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<path d="M850,769 L880,769" fill="none" stroke="#B42318" stroke-width="1.3" marker-end="url(#arrow-B42318)" stroke-linejoin="round"/>
<path d="M450,808 L450,828" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<path d="M850,867 L880,867" fill="none" stroke="#B42318" stroke-width="1.3" marker-end="url(#arrow-B42318)" stroke-linejoin="round"/>
<path d="M450,906 L450,946" fill="none" stroke="#5B6770" stroke-width="1.3" marker-end="url(#arrow-5B6770)" stroke-linejoin="round"/>
<path d="M1000,890 L1000,946" fill="none" stroke="#5B6770" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow-5B6770)" stroke-linejoin="round"/>
<rect x="696.992" y="216.8" width="86.01599999999999" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="740" y="226" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#2F6FB2">claims + request</text>
<rect x="484.306" y="924.8" width="71.388" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="520" y="934" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#5B6770">every outcome</text>
<text x="50" y="1076" text-anchor="start" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1F2933">What the client cannot change</text>
<text x="50" y="1098" text-anchor="start" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6770">which manifest and version run · which role it holds · which primitives exist · which resource types and operations a role may touch · that the call is on the record ·</text>
<text x="50" y="1114" text-anchor="start" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6770">the primitive's configuration — code list, patient filter, window, a write's ranges and allowed values — which the dispatcher resolves from the published manifest itself</text>
<text x="50" y="1130" text-anchor="start" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6770">(declared_config.py); a request that spells a declared value differently is refused (400) with the paths on its audit record.</text>
<text x="50" y="1154" text-anchor="start" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6770">Still the client's, by nature: what the manifest marks as the person's input ($ui — validated as a write) or an earlier primitive's output ($bindings — within the role's scope).</text>
<line x1="1150" y1="1094" x2="1184" y2="1094" stroke="#2F6FB2" stroke-width="1.6"/>
<text x="1192" y="1098" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#5B6770">request path</text>
<line x1="1150" y1="1112" x2="1184" y2="1112" stroke="#B42318" stroke-width="1.6"/>
<text x="1192" y="1116" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#5B6770">refusal (audited)</text>
<line x1="1150" y1="1130" x2="1184" y2="1130" stroke="#5B6770" stroke-width="1.6"/>
<text x="1192" y="1134" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#5B6770">audit</text>
</svg>