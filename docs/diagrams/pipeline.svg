<path d="M640,645 L660,645" fill="none" stroke="#0F7B5F" stroke-width="1.3" marker-end="url(#arrow-0F7B5F)" stroke-linejoin="round"/>
<path d="M820,400 L820,580" fill="none" stroke="#0F7B5F" stroke-width="1.3" marker-end="url(#arrow-0F7B5F)" stroke-linejoin="round"/>
<path d="M640,985 L660,985" fill="none" stroke="#B7791F" stroke-width="1.3" marker-end="url(#arrow-B7791F)" stroke-linejoin="round"/>
<path d="M955,710 L955,920" fill="none" stroke="#B7791F" stroke-width="1.3" marker-end="url(#arrow-B7791F)" stroke-linejoin="round"/>
<path d="M955,1050 L955,1260" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<path d="M640,1325 L660,1325" fill="none" stroke="#2F6FB2" stroke-width="1.3" marker-end="url(#arrow-2F6FB2)" stroke-linejoin="round"/>
<text x="50" y="440" text-anchor="start" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#1F2933">Checked here: every argument against the knob schema · codes verified on the record · unknown shapes refused · readiness empty before compile</text>
<rect x="346.496" y="172.8" width="47.007999999999996" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="370" y="182" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6B4FA8">sentence</text>
<rect x="841.62" y="260.8" width="56.760000000000005" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="870" y="270" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#6B4FA8">tool calls</text>
<text x="50" y="775" text-anchor="start" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#1F2933">Checked here: the spec validated again, with cross-field rules · the manifest against the shared schema</text>
<rect x="633.81" y="622.8" width="32.38" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="650" y="632" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#0F7B5F">build</text>
<rect x="838.934" y="500.8" width="42.132" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="860" y="510" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#0F7B5F">compile</text>
<text x="50" y="1115" text-anchor="start" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#1F2933">Checked here: a person who is not the author reads the role bindings, scopes and writes · the signature is stored with approver, time and notes · role groups created at publish</text>
<rect x="604.554" y="962.8" width="90.892" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="650" y="972" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#B7791F">approve · publish</text>
<rect x="979.926" y="840.8" width="120.148" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="1040" y="850" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#B7791F">save as a draft version</text>
<text x="50" y="1455" text-anchor="start" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" font-weight="400" fill="#1F2933">Checked here: version published · caller's groups · primitive declared · resource type and operation in scope · declared config resolved from the manifest, not the request · audit record always</text>
<rect x="984.554" y="1180.8" width="90.892" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="1030" y="1190" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#2F6FB2">published version</text>
<rect x="592.364" y="1302.8" width="115.27199999999999" height="14.2" fill="white" fill-opacity="0.92" rx="3"/>
<text x="650" y="1312" text-anchor="middle" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.2" fill="#2F6FB2">one POST per primitive</text>
<line x1="50" y1="1541" x2="84" y2="1541" stroke="#6B4FA8" stroke-width="1.6"/>
<text x="92" y="1545" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#5B6770">model</text>
<line x1="50" y1="1559" x2="84" y2="1559" stroke="#0F7B5F" stroke-width="1.6"/>
<text x="92" y="1563" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#5B6770">pure functions, tested against golden outputs</text>
<line x1="50" y1="1577" x2="84" y2="1577" stroke="#B7791F" stroke-width="1.6"/>
<text x="92" y="1581" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#5B6770">human sign-off</text>
<line x1="50" y1="1595" x2="84" y2="1595" stroke="#2F6FB2" stroke-width="1.6"/>
<text x="92" y="1599" font-family="Lato, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.8" fill="#5B6770">runtime, enforced server-side</text>
</svg>